          - generic [ref=e92]:
            - heading "Q 声誉到底有什么用？" [level=3] [ref=e93]
            - paragraph [ref=e94]: 声誉是你在这个生态中的可信度凭证。声誉越高，你可以发布和验证的技能等级越高，参与重要决策的权重也越大，同时更容易被其他用户和合作方信任。
          - generic [ref=e95]:
            - heading "Q 怎么保证技能质量？" [level=3] [ref=e96]
            - paragraph [ref=e97]: 每个 Skill 都需要经过社区测试、风险评估和同行审核；所有审核记录和贡献者声誉都公开透明。低质或恶意技能会被标记，优质技能会自然获得更高排名。
          - generic [ref=e98]:
            - heading "Q 我的贡献会被记录吗？" [level=3] [ref=e99]
            - paragraph [ref=e100]: 会。你发布的技能、提交的验证、提供的反馈都会被记录为不可篡改的声誉记录，成为你长期可信度的组成部分。