version: '3.8'

services:
  agentskills-api:
    build: .
    container_name: agentskills-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # 允许的前端域名，多个用逗号分隔
      - CORS_ORIGIN=${CORS_ORIGIN:-https://ptreezh.github.io}
      - POLYGON_AMOY_RPC=${POLYGON_AMOY_RPC:-https://rpc-amoy.polygon.technology}
      # 提交链上交易的钱包私钥（必填）
      - PRIVATE_KEY=${PRIVATE_KEY}
      # 已部署的 SkillRegistry 地址（必填）
      - SKILL_REGISTRY_ADDRESS=${SKILL_REGISTRY_ADDRESS}
      # 上传文件持久化目录
      - UPLOADS_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  uploads:
