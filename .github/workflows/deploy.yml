name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy'
        required: true
        default: 'polygonAmoy'
        type: choice
        options:
          - polygonAmoy
          - polygon

env:
  NODE_VERSION: '20'

jobs:
  deploy:
    name: Deploy to ${{ inputs.network || 'polygonAmoy' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.network == 'polygon' && 'production' || 'staging' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test test/contracts/*.test.cjs

      - name: Deploy contracts
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx hardhat run scripts/deploy-core-v2.js --network ${{ inputs.network || 'polygonAmoy' }}
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          POLYGON_RPC: ${{ secrets.POLYGON_RPC }}
          POLYGON_AMOY_RPC: ${{ secrets.POLYGON_AMOY_RPC }}

      - name: Verify deployment
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "Deployment completed"
          cat deployments/core-latest.json

      - name: Upload deployment artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts-${{ inputs.network || 'polygonAmoy' }}
          path: deployments/
          retention-days: 30

  verify:
    name: Validate deployment artifacts
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifacts-${{ inputs.network }}
          path: deployments/

      - name: Validate deployment artifacts
        run: |
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('deployments/core-latest.json', 'utf8'));
            const required = ['StakingManager', 'SkillRegistry', 'Attribution', 'Governance', 'SelfSustainingEcosystem', 'ReputationBadges'];
            const missing = required.filter(k => !/^0x[0-9a-fA-F]{40}$/.test(d.contracts?.[k] ?? ''));
            if (missing.length > 0) {
              console.error('Missing or invalid contract addresses:', missing);
              process.exit(1);
            }
            console.log('Deployment artifact OK');
            console.log('Network:', d.network, '(chainId', d.chainId + ')');
            for (const k of required) console.log(' ', k + ':', d.contracts[k]);
          "