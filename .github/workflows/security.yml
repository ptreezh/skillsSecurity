name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slither:
    name: Slither Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Slither and solc
        run: |
          pip install slither-analyzer solc-select setuptools
          solc-select install 0.8.20
          solc-select use 0.8.20
          if [ -d "$HOME/.local/bin" ]; then echo "$HOME/.local/bin" >> "$GITHUB_PATH"; fi
          if [ -d "$HOME/.solc-select/artifacts/solc-0.8.20" ]; then echo "$HOME/.solc-select/artifacts/solc-0.8.20" >> "$GITHUB_PATH"; fi

      - name: Run Slither
        id: slither
        run: |
          echo "=== Running Slither ==="
          solc --version
          slither . --sarif results.sarif --exclude-dependencies --solc-remaps "@openzeppelin=node_modules/@openzeppelin"
          test -s results.sarif || { echo "FAIL: results.sarif not generated"; exit 1; }
          echo "Slither analysis completed: $(wc -c < results.sarif) bytes"

      - name: Upload Slither results
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
          category: slither

      - name: Archive Slither report
        if: always() && hashFiles('results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: slither-results.sarif
          path: results.sarif

      - name: Display findings summary
        if: always()
        run: |
          echo "=== Slither Findings Summary ==="
          if [ -f results.sarif ] && command -v jq &> /dev/null; then
            HIGH=$(jq '[.runs[0].results[]? | select(.properties.tags[0] == "High")] | length' results.sarif)
            MEDIUM=$(jq '[.runs[0].results[]? | select(.properties.tags[0] == "Medium")] | length' results.sarif)
            LOW=$(jq '[.runs[0].results[]? | select(.properties.tags[0] == "Low")] | length' results.sarif)
            echo "HIGH: $HIGH"
            echo "MEDIUM: $MEDIUM"
            echo "LOW: $LOW"
            echo "DETECTORS:"
            jq -r '.runs[0].results[]? | "\(.properties.tags[0]) \(.message.text | split("\n")[0])"' results.sarif || true
          else
            echo "No results.sarif or jq not available"
            exit 1
          fi

  mythril:
    name: Mythril Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Mythril
        run: |
          pip install mythril[cli]
          pip show mythril | grep -E '^(Name|Version):'
          echo "=== mythril analyze --help (diagnostic) ==="
          myth analyze --help > /tmp/mythril-help.txt 2>&1 || true
          head -30 /tmp/mythril-help.txt

      - name: Run Mythril on core contracts
        run: |
          echo "=== Mythril Analysis ==="
          for contract in StakingManager SkillRegistry Attribution; do
            echo "Analyzing $contract..."
            myth analyze contracts/$contract.sol --solc-json .github/mythril-solc.json > results_mythril_$contract.txt 2>&1 || { echo "mythril exit=$? for $contract (exited during analysis)"; true; }
          done

      - name: Verify mythril reports exist
        run: |
          for contract in StakingManager SkillRegistry Attribution; do
            f="results_mythril_$contract.txt"
            if [ ! -s "$f" ]; then
              echo "FAIL: $f missing or empty — mythril did not run"
              exit 1
            fi
            echo "$f: $(wc -l < "$f") lines, $(wc -c < "$f") bytes"
          done

      - name: Archive Mythril reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mythril-reports
          path: results_mythril_*.txt

      - name: Display Mythril results
        run: |
          echo "=== Issues Found ==="
          for f in results_mythril_*.txt; do
            if [ -s "$f" ]; then
              echo "--- $f ---"
              head -40 "$f"
            fi
          done

  test:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test test/contracts/StakingManager.test.cjs test/contracts/SkillRegistry.test.cjs test/contracts/Attribution.test.cjs test/contracts/Governance.test.cjs test/contracts/Integration.test.cjs test/contracts/ReputationBadges.test.cjs test/contracts/SelfSustainingEcosystem.test.cjs

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
        continue-on-error: true

  dependency-check:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit runtime dependencies (production gate)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies (dev-tooling backlog, informational)
        run: |
          npm audit --audit-level=high || true
          echo "Dev-tooling high backlog is tracked in REPORTS/, informational only."

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: |
          npx prettier --check contracts/*.sol src/**/*.jsx 2>/dev/null || echo "Prettier check skipped"

      - name: Solidity lint
        run: |
          npx solhint contracts/*.sol || echo "solhint exit code: $? (informational, not gating)"